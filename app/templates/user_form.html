{% extends "base.html" %}

{% block title %}Edit user · StockPilot AI{% endblock %}
{% block heading %}Edit {{ user.name }}{% endblock %}

{% block content %}
<section class="panel form-panel edit-card">
  <p class="eyebrow">ACCOUNT & PERMISSIONS</p><h2>Update staff access</h2>
  <form method="post" class="data-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row"><label>Name<input name="name" value="{{ user.name }}" maxlength="255" required></label><label>Email<input type="email" name="email" value="{{ user.email }}" maxlength="255" required></label></div>
    <div class="form-row"><label>Role<select name="role" required>{% for value, label in roles.items() %}<option value="{{ value }}" {% if user.role == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>New password<input type="password" name="password" minlength="10" maxlength="128" autocomplete="new-password" placeholder="Leave blank to keep current"></label></div>
    <label class="checkbox-label"><input type="checkbox" name="is_active" value="true" {% if user.is_active %}checked{% endif %}> Active account</label>
    <div class="inline-actions"><button class="button primary" type="submit">Save user</button><a class="button secondary" href="{{ url_for('web.users_page') }}">Cancel</a></div>
  </form>
</section>
{% endblock %}
